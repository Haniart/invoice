<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 1 mkk 3</title>
</head>
  <body>
    <script>
      // 1. Data
      var nama = "Andi";
      var tugas = 80;
      var uts = 75;
      var uas = 90;

      // 2. Hitung nilai akhir (30% + 30% + 40%)
      var nilaiAkhir = tugas * 0.3 + uts * 0.3 + uas * 0.4;
      // 3. Tentukan status lulus atau tidak
      var status;
      if (nilaiAkhir >= 75) {
        status = "LULUS";
      } else {
        status = "TIDAK LULUS";
      }
      // 4. Tampilkan hasil
      console.log("Nama        : " + nama);
      console.log("Nilai Akhir : " + nilaiAkhir);
      console.log("Status      : " + status);
      // 5. Tampilkan hasil di browser
      document.write("Nama        : " + nama + "<br>");
      document.write("Nilai Akhir : " + nilaiAkhir + "<br>");
      document.write("Status      : " + status);
    </script>
  </body>
</html>
